name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (H2 en memoria, mismas migraciones Flyway)
        run: chmod +x gradlew && ./gradlew test --no-daemon
      - name: Informe de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-tests
          path: backend/build/reports/tests/test

  web:
    name: Web · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  migraciones:
    name: MySQL 8.4 · migraciones Flyway
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lecfantasy
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar todas las migraciones como en Railway
        run: >
          docker run --rm --network host -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql"
          flyway/flyway:10 -url="jdbc:mysql://127.0.0.1:3306/lecfantasy?allowPublicKeyRetrieval=true&useSSL=false"
          -user=root -password=root migrate
